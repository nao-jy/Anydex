[package]
name = "anydex"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "anydex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anydex-plugin-api = { path = "../src-plugin/anydex-plugin-api" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
specta = { version = "2.0.0-rc.25", features = [
    "derive",
    "chrono",
    "serde_json",
] }
tauri-specta = { version = "2.0.0-rc.25", features = [
    "javascript",
    "typescript",
] }
specta-typescript = "0.0.12"
tauri-plugin-store = "2.5.0"
chrono = { version = "0.4.45", features = ["serde"] }
tokio = { version = "1", features = ["net", "rt", "sync", "time"] }
sea-orm = { version = "2.0.4", features = [
    "sqlx-sqlite",
    "runtime-tokio",
    "macros",
] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2"
libloading = "0.9.0"
axum = "0.8.9"
enum-iterator = "2.3.0"
tauri-plugin-dialog = "2"
oauth2 = "5.0.0"
webbrowser = "1.2.4"
subtle = "2.6.1"
uuid = { version = "1.26.1", features = ["v4", "v7", "serde"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
