[workspace]
members = ["embedder", "file_extractor", "file_source", "vector_store"]
resolver = "3"

[workspace.dependencies]
anydex-plugin-api = { path = "../anydex-plugin-api" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
chrono = { version = "0.4.45", features = ["serde"] }
tokio = { version = "1", features = ["net", "rt", "sync", "time"] }
schemars = "1.2"
mime_guess = "2.0.5"
encoding_rs = "0.8.41"
chardetng = "1.0.0"
