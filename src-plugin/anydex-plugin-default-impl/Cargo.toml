[workspace]
members = ["embedder", "file_extractor", "file_source", "vector_store"]

resolver = "3"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
chrono = { version = "0.4.45", features = ["serde"] }
tokio = { version = "1", features = ["net", "rt", "sync", "time"] }
