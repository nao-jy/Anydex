[workspace]
members = ["embedder", "file_extractor", "file_source", "vector_store"]
resolver = "3"

[workspace.dependencies]
anydex-plugin-api = { path = "../anydex-plugin-api" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
chrono = { version = "0.4.45", features = ["serde"] }
tokio = { version = "1", features = ["net", "rt", "sync", "time"] }
schemars = { version = "1.2", features = ["preserve_order"] }
mime_guess = "2.0.5"
encoding_rs = "0.8.41"
chardetng = "1.0.0"
image = "0.25.10"
uuid = { version = "1.26.1", features = ["v4", "v7", "serde"] }
process_path = "0.1.4"
