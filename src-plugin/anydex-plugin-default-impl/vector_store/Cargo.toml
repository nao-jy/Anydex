[package]
name = "anydex-plugin-default-impl-vector-store"
version = "0.1.0"
description = "Anydex Plugin Default Impl Vector Store"
authors = ["you"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "anydex_plugin_default_impl_vector_store_lib"
crate-type = ["cdylib"]

[dependencies]
rusqlite = { version = "0.40.2", features = ["load_extension", "bundled"] }
anydex-plugin-api.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
process_path.workspace = true
