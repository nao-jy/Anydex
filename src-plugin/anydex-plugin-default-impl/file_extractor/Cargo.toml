[package]
name = "anydex-plugin-default-impl-file-extractor"
version = "0.1.0"
description = "Anydex Plugin Default Impl File Extractor"
authors = ["you"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "anydex_plugin_default_impl_file_extractor_lib"
crate-type = ["cdylib"]

[dependencies]
xberg = "1.2.6"
anydex-plugin-api.workspace = true
