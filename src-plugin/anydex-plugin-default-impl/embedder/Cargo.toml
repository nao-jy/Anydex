[package]
name = "anydex-plugin-default-impl-embedder"
version = "0.1.0"
description = "Anydex Plugin Default Impl Embedder"
authors = ["you"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "anydex_plugin_default_impl_embedder_lib"
crate-type = ["cdylib"]

[dependencies]
reqwest = { version = "0.13.5", features = ["blocking"] }
base64 = "0.23.1"
image = "0.25.10"
jsonpath-rust = "1.0.11"
anydex-plugin-api.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
mime_guess.workspace = true
encoding_rs.workspace = true
chardetng.workspace = true
